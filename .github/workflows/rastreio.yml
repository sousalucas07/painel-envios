name: Automacao de Rastreio USPS

on:
  schedule:
    # Roda a cada 3 horas (00:00, 03:00, 06:00, etc)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite rodar manualmente na aba Actions do GitHub

jobs:
  executar-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar credentials.json a partir do Secret do GitHub
        run: |
          cat << 'EOF' > credentials.json
          ${{ secrets.GCP_CREDENTIALS_JSON }}
          EOF

      - name: Executar rastreio da USPS
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          SHIPPO_LIVE_KEY: ${{ secrets.SHIPPO_LIVE_KEY }}
        run: |
          python tracker.py