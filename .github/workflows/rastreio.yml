name: Automacao de Rastreio USPS

on:
  workflow_dispatch: # Disparado pelo cron-job.org e manualmente na aba Actions

concurrency:
  group: rastreio-usps
  cancel-in-progress: false

jobs:
  executar-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências e Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Criar credentials.json a partir do Secret do GitHub
        env:
          GCP_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          echo "$GCP_JSON" > credentials.json

      - name: Executar rastreio da USPS
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          SHIPPO_LIVE_KEY: ${{ secrets.SHIPPO_LIVE_KEY }}
          WHATCRM_TOKEN: ${{ secrets.WHATCRM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tracker.py