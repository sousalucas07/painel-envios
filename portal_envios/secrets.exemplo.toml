# Copie para portal_envios/secrets.toml (NUNCA vai para o git) e preencha.
# O jeito mais fácil: cole aqui o conteúdo de Settings → Secrets do app no Streamlit Cloud
# e acrescente as duas linhas do PORTAL_ENVIOS_ no topo.
# Chaves soltas ficam ACIMA do [gcp_service_account].

PORTAL_ENVIOS_SEGREDO = ""   # texto longo e aleatório: openssl rand -hex 32
PORTAL_ENVIOS_SENHA = ""     # senha de entrada (vazio = usa o DASHBOARD_SENHA)

DASHBOARD_SENHA = ""
EMISSAO_SENHA = ""
SHIPPO_LIVE_KEY = ""
BITRIX_WEBHOOK_URL = ""
WHATCRM_TOKEN = ""
GEMINI_API_KEY = ""

[gcp_service_account]
type = "service_account"
project_id = ""
private_key_id = ""
private_key = ""
client_email = ""
client_id = ""
token_uri = "https://oauth2.googleapis.com/token"
